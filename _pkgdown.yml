url: https://alex-nguyen-vn.github.io/mapycusmaximus/

template:
  bootstrap: 5
  bslib:
    primary: "#4B6A9B"
    base_font: {google: "Inter"}
    heading_font: {google: "IBM Plex Sans"}
    code_font: {google: "Fira Mono"}
  bootswatch: flatly

navbar:
  structure:
    left: [home, reference, articles, news]
    right: [github]
  components:
    home:
      text: "Home"
      href: index.html
    reference:
      text: "Reference"
      href: reference/index.html
    articles:
      text: "Articles"
      href: articles/index.html
    news:
      text: "News"
      href: news/index.html
    github:
      icon: fab fa-github
      href: https://github.com/Alex-Nguyen-VN/mapycusmaximus

reference:
  - title: "Core Transformation Functions"
    contents:
      - fisheye_fgc
      - sf_fisheye
      - classify_zones
  - title: "Visualization Utilities"
    contents:
      - plot_fisheye_fgc
      - create_test_grid
  - title: "Spatial Transformation Tools"
    contents:
      - st_transform_custom
  - title: "Datasets"
    contents:
      - vic
      - conn_fish
      - vic_fish
  - title: "Shiny"
    contents:
      - shiny_fisheye
  #- title: "Helper Functions"
    #contents:
      #- normalize_coords
      #- denormalize_coords

#articles:
